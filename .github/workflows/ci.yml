name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # archlint compares with the base branch, so it needs the history.
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true

      - run: vp check
      - run: vp run -r build
      - run: vp run -r test
        env:
          # Shared runners are slower than a laptop; the budgets still catch regressions.
          ARCHLINT_BUDGET_FACTOR: '2'

      - name: archlint
        run: vp exec archlint check ${{ github.event_name == 'pull_request' && format('--base origin/{0} --new', github.base_ref) || '' }}
