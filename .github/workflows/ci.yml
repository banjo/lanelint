name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # pilotlint compares with the base branch, so it needs the history.
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true

      - run: vp check
      - run: vp run -r build
      - run: vp run -r test

      # Prints the time of checks on about 1,000 files. It never fails on the times.
      - run: vp run --no-cache pilotlint#bench

      - name: pilotlint
        run: vp exec pilotlint check ${{ github.event_name == 'pull_request' && format('--base origin/{0} --new', github.base_ref) || '' }}
