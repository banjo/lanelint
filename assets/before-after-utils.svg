<svg xmlns="http://www.w3.org/2000/svg" width="940" height="536" viewBox="0 0 940 536" role="img" aria-label="Before: src/utils.ts with loose date and price functions and a default export. After: src/utils/dateUtil.ts with only date functions, exported as one DateUtil object.">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <style>
    .card { fill: #ffffff; stroke: #e5e7eb; }
    .panel { fill: #f8fafc; stroke: #eef2f7; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #1e293b; white-space: pre; }
    .head { font-size: 13px; font-weight: 600; }
    .sub { font-size: 13px; fill: #64748b; }
    .item { font-size: 13.5px; fill: #334155; }
    .bad-pill { fill: #fef2f2; } .bad-pill-text { fill: #dc2626; }
    .good-pill { fill: #f0fdf4; } .good-pill-text { fill: #16a34a; }
    .bad-dot { fill: #fee2e2; } .good-dot { fill: #dcfce7; }
    .bad-mark { stroke: #dc2626; } .good-mark { stroke: #16a34a; }
    .arrow-bg { fill: #ffffff; stroke: #e5e7eb; } .arrow { stroke: #64748b; }
    .dim { fill: #94a3b8; } .dir { fill: #0369a1; } .file { fill: #1e293b; } .bad { fill: #dc2626; }
    .kw { fill: #7c3aed; } .str { fill: #047857; } .num { fill: #b45309; } .type { fill: #0e7490; } .fn { fill: #1d4ed8; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161b22; stroke: #30363d; }
      .panel { fill: #0d1117; stroke: #21262d; }
      .mono, .file { fill: #e6edf3; }
      .sub { fill: #8b949e; }
      .item { fill: #c9d1d9; }
      .bad-pill { fill: #3b1219; } .bad-pill-text { fill: #ff7b72; }
      .good-pill { fill: #0f2e1b; } .good-pill-text { fill: #56d364; }
      .bad-dot { fill: #3b1219; } .good-dot { fill: #0f2e1b; }
      .bad-mark { stroke: #ff7b72; } .good-mark { stroke: #56d364; }
      .arrow-bg { fill: #161b22; stroke: #30363d; } .arrow { stroke: #8b949e; }
      .dim { fill: #6e7681; } .dir { fill: #79c0ff; } .bad { fill: #ff7b72; }
      .kw { fill: #d2a8ff; } .str { fill: #a5d6ff; } .num { fill: #ffa657; } .type { fill: #7ee787; } .fn { fill: #79c0ff; }
    }
  </style>
  <rect x="8" y="8" width="444" height="508" rx="16" class="card" filter="url(#shadow)"/>
  <rect x="30" y="30" width="66" height="26" rx="13" class="bad-pill"/>
  <text x="63.0" y="47.5" text-anchor="middle" class="sans head bad-pill-text">Before</text>
  <text x="108" y="47.5" class="sans sub">src/utils.ts</text>
  <rect x="26" y="74" width="408" height="324" rx="10" class="panel"/>
  <text x="42" y="100" class="mono" xml:space="preserve"><tspan class="kw">export</tspan> <tspan class="kw">function</tspan> <tspan class="fn">formatDate</tspan>(date: <tspan class="type">Date</tspan>) {</text>
  <text x="42" y="120" class="mono" xml:space="preserve">  <tspan class="kw">return</tspan> date.<tspan class="fn">toISOString</tspan>().<tspan class="fn">slice</tspan>(<tspan class="num">0</tspan>, <tspan class="num">10</tspan>);</text>
  <text x="42" y="140" class="mono" xml:space="preserve">}</text>
  <text x="42" y="160" class="mono" xml:space="preserve"></text>
  <text x="42" y="180" class="mono" xml:space="preserve"><tspan class="kw">export</tspan> <tspan class="kw">const</tspan> addDays = (date: <tspan class="type">Date</tspan>, n: <tspan class="type">number</tspan>) =&gt;</text>
  <text x="42" y="200" class="mono" xml:space="preserve">  <tspan class="kw">new</tspan> <tspan class="type">Date</tspan>(date.<tspan class="fn">getTime</tspan>() + n * <tspan class="num">86_400_000</tspan>);</text>
  <text x="42" y="220" class="mono" xml:space="preserve"></text>
  <text x="42" y="240" class="mono" xml:space="preserve"><tspan class="kw">export</tspan> <tspan class="kw">const</tspan> formatPrice = (cents: <tspan class="type">number</tspan>) =&gt;</text>
  <text x="42" y="260" class="mono" xml:space="preserve">  <tspan class="str">`$${(cents / 100).toFixed(2)}`</tspan>;</text>
  <text x="42" y="280" class="mono" xml:space="preserve"></text>
  <text x="42" y="300" class="mono" xml:space="preserve"><tspan class="kw">export</tspan> <tspan class="kw">function</tspan> <tspan class="fn">isWeekend</tspan>(date: <tspan class="type">Date</tspan>) {</text>
  <text x="42" y="320" class="mono" xml:space="preserve">  <tspan class="kw">return</tspan> [<tspan class="num">0</tspan>, <tspan class="num">6</tspan>].<tspan class="fn">includes</tspan>(date.<tspan class="fn">getDay</tspan>());</text>
  <text x="42" y="340" class="mono" xml:space="preserve">}</text>
  <text x="42" y="360" class="mono" xml:space="preserve"></text>
  <text x="42" y="380" class="mono" xml:space="preserve"><tspan class="kw">export</tspan> <tspan class="kw">default</tspan> { formatDate, formatPrice };</text>
  <circle cx="42" cy="428" r="10" class="bad-dot"/>
  <path d="M38.5 424.5 L45.5 431.5 M45.5 424.5 L38.5 431.5" class="bad-mark" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="62" y="432.5" class="sans item">Dates and prices mixed in one file</text>
  <circle cx="42" cy="458" r="10" class="bad-dot"/>
  <path d="M38.5 454.5 L45.5 461.5 M45.5 454.5 L38.5 461.5" class="bad-mark" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="62" y="462.5" class="sans item">Loose functions that clash with other names</text>
  <circle cx="42" cy="488" r="10" class="bad-dot"/>
  <path d="M38.5 484.5 L45.5 491.5 M45.5 484.5 L38.5 491.5" class="bad-mark" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="62" y="492.5" class="sans item">A default export, named differently everywhere</text>
  <rect x="488" y="8" width="444" height="508" rx="16" class="card" filter="url(#shadow)"/>
  <rect x="510" y="30" width="58" height="26" rx="13" class="good-pill"/>
  <text x="539.0" y="47.5" text-anchor="middle" class="sans head good-pill-text">After</text>
  <text x="580" y="47.5" class="sans sub">src/utils/dateUtil.ts</text>
  <rect x="506" y="74" width="408" height="324" rx="10" class="panel"/>
  <text x="522" y="100" class="mono" xml:space="preserve"><tspan class="kw">const</tspan> format = (date: <tspan class="type">Date</tspan>) =&gt;</text>
  <text x="522" y="120" class="mono" xml:space="preserve">  date.<tspan class="fn">toISOString</tspan>().<tspan class="fn">slice</tspan>(<tspan class="num">0</tspan>, <tspan class="num">10</tspan>);</text>
  <text x="522" y="140" class="mono" xml:space="preserve"></text>
  <text x="522" y="160" class="mono" xml:space="preserve"><tspan class="kw">const</tspan> addDays = (date: <tspan class="type">Date</tspan>, n: <tspan class="type">number</tspan>) =&gt;</text>
  <text x="522" y="180" class="mono" xml:space="preserve">  <tspan class="kw">new</tspan> <tspan class="type">Date</tspan>(date.<tspan class="fn">getTime</tspan>() + n * <tspan class="num">86_400_000</tspan>);</text>
  <text x="522" y="200" class="mono" xml:space="preserve"></text>
  <text x="522" y="220" class="mono" xml:space="preserve"><tspan class="kw">const</tspan> isWeekend = (date: <tspan class="type">Date</tspan>) =&gt;</text>
  <text x="522" y="240" class="mono" xml:space="preserve">  [<tspan class="num">0</tspan>, <tspan class="num">6</tspan>].<tspan class="fn">includes</tspan>(date.<tspan class="fn">getDay</tspan>());</text>
  <text x="522" y="260" class="mono" xml:space="preserve"></text>
  <text x="522" y="280" class="mono" xml:space="preserve"><tspan class="kw">export</tspan> <tspan class="kw">const</tspan> <tspan class="type">DateUtil</tspan> = {</text>
  <text x="522" y="300" class="mono" xml:space="preserve">  format,</text>
  <text x="522" y="320" class="mono" xml:space="preserve">  addDays,</text>
  <text x="522" y="340" class="mono" xml:space="preserve">  isWeekend,</text>
  <text x="522" y="360" class="mono" xml:space="preserve">};</text>
  <circle cx="522" cy="428" r="10" class="good-dot"/>
